services:
  mysql:
    image: mysql:8.0
    container_name: sigic-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sigic_espoch
      MYSQL_USER: sigic_user
      MYSQL_PASSWORD: sigic_pass
    ports:
      - "3307:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - sigic-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      timeout: 20s
      retries: 10
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sigic-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: sigic_user
      PMA_PASSWORD: sigic_pass
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sigic-network

  backend:
    build: ./backend
    container_name: sigic-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: sigic_user
      DB_PASSWORD: sigic_pass
      DB_NAME: sigic_espoch
      PORT: 3000
    ports:
      - "3002:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sigic-network

  frontend:
    build: ./frontend
    container_name: sigic-frontend
    restart: always
    ports:
      - "3003:80"
    depends_on:
      - backend
    networks:
      - sigic-network

volumes:
  mysql_data:

networks:
  sigic-network:
    driver: bridge