<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIC-ESPOCH | Inicio de Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-logo {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #0066CC, #004C99);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        .login-logo i { font-size: 3rem; color: white; }
        .login-header h1 { font-size: 1.75rem; color: #1a1a2e; margin-bottom: 0.5rem; }
        .login-header p { color: #6c757d; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #2d3748; }
        .input-group { position: relative; }
        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }
        .input-group input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #0066CC;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #0066CC, #004C99);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0,102,204,0.4);
        }
        .demo-credentials {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }
        .demo-credentials p {
            font-size: 0.8rem;
            color: #718096;
            margin-bottom: 0.75rem;
            text-align: center;
        }
        .demo-buttons {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }
        .demo-btn {
            padding: 0.5rem 1rem;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .demo-btn:hover {
            background: #edf2f7;
            border-color: #0066CC;
        }
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: none;
        }
        .footer {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-network-wired"></i>
                </div>
                <h1>SIGIC-ESPOCH</h1>
                <p>Sistema de Gestión de Inventario y Cursos</p>
                <small>Programa CISCO - ESPOCH</small>
            </div>

            <div id="error-message" class="error-message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>Usuario / Email</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>

            <div class="demo-credentials">
                <p><i class="fas fa-info-circle"></i> Credenciales de demostración:</p>
                <div class="demo-buttons">
                    <button type="button" class="demo-btn" onclick="setDemoCredentials('custodio')">
                        <i class="fas fa-user-shield"></i> Custodio
                    </button>
                    <button type="button" class="demo-btn" onclick="setDemoCredentials('consultor')">
                        <i class="fas fa-eye"></i> Consultor
                    </button>
                    <button type="button" class="demo-btn" onclick="setDemoCredentials('admin')">
                        <i class="fas fa-crown"></i> Administrador
                    </button>
                </div>
                <p style="margin-top: 0.75rem; font-size: 0.7rem;">
                    Custodio: custodio@espoch.edu.ec / 123456<br>
                    Consultor: consultor@espoch.edu.ec / 123456<br>
                    Admin: admin@espoch.edu.ec / 123456
                </p>
            </div>
        </div>
        <div class="footer">
            <p>ESPOCH - Facultad de Informática y Electrónica © 2026</p>
        </div>
    </div>

    <script>
        const users = {
            custodio: {
                username: 'custodio@espoch.edu.ec',
                password: '123456',
                name: 'Ana María López',
                role: 'Custodio',
                role_code: 'custodio'
            },
            consultor: {
                username: 'consultor@espoch.edu.ec',
                password: '123456',
                name: 'Carlos Consultor',
                role: 'Consultor',
                role_code: 'consultor'
            },
            admin: {
                username: 'admin@espoch.edu.ec',
                password: '123456',
                name: 'Administrador SIGIC',
                role: 'Administrador',
                role_code: 'admin'
            }
        };

        window.setDemoCredentials = function(type) {
            const user = users[type];
            if (user) {
                document.getElementById('username').value = user.username;
                document.getElementById('password').value = user.password;
            }
        };

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            let authenticatedUser = null;
            for (let key in users) {
                if (users[key].username === username && users[key].password === password) {
                    authenticatedUser = users[key];
                    break;
                }
            }

            if (authenticatedUser) {
                const session = {
                    user: authenticatedUser,
                    loggedIn: true,
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem('sigic_session', JSON.stringify(session));
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.textContent = '❌ Usuario o contraseña incorrectos';
                errorDiv.style.display = 'block';
                setTimeout(function() {
                    errorDiv.style.display = 'none';
                }, 3000);
            }
        });

        const existingSession = localStorage.getItem('sigic_session');
        if (existingSession) {
            try {
                const session = JSON.parse(existingSession);
                if (session.loggedIn) {
                    window.location.href = 'dashboard.html';
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
